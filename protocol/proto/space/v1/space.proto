syntax = "proto3";

package space.v1;

import "google/api/annotations.proto";

option go_package = "github.com/space-protocol-project/space-server/gen/space/v1;spacev1";

// Экспериментальный контракт первого локального прототипа.
service ChannelService {
  rpc WatchChannels(WatchChannelsRequest) returns (stream WatchChannelsResponse) {
    option (google.api.http) = {get: "/api/v1/channels/watch"};
  }

  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse) {
    option (google.api.http) = {get: "/api/v1/channels"};
  }
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse) {
    option (google.api.http) = {post: "/api/v1/channels" body: "*"};
  }
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse) {
    option (google.api.http) = {patch: "/api/v1/channels/{channel_id}" body: "*"};
  }
  rpc GetChannelAccess(GetChannelAccessRequest) returns (GetChannelAccessResponse) {
    option (google.api.http) = {get: "/api/v1/channels/{channel_id}/access"};
  }
  rpc UpdateChannelAccess(UpdateChannelAccessRequest) returns (UpdateChannelAccessResponse) {
    option (google.api.http) = {put: "/api/v1/channels/{channel_id}/access" body: "*"};
  }
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse) {
    option (google.api.http) = {get: "/api/v1/manifest"};
  }
}

service ContentService {
  rpc CreateContent(CreateContentRequest) returns (CreateContentResponse) {
    option (google.api.http) = {post: "/api/v1/channels/{channel_id}/content" body: "*"};
  }
  rpc ListContent(ListContentRequest) returns (ListContentResponse) {
    option (google.api.http) = {get: "/api/v1/channels/{channel_id}/content"};
  }
}

service AuthService {
  // Экспериментальный API; требует поддержки stable principal у клиента.
  rpc CreateRootRotation(CreateRootRotationRequest) returns (CreateRootRotationResponse) {
    option (google.api.http) = {post: "/api/v1/auth/root-rotations" body: "*"};
  }
  rpc CompleteRootRotation(CompleteRootRotationRequest) returns (CompleteRootRotationResponse) {
    option (google.api.http) = {post: "/api/v1/auth/root-rotations/complete" body: "*"};
  }
  rpc ProposePairing(ProposePairingRequest) returns (ProposePairingResponse) {
    option (google.api.http) = {post: "/api/v1/auth/pairings/propose" body: "*"};
  }
  rpc CreatePairing(CreatePairingRequest) returns (CreatePairingResponse) {
    option (google.api.http) = {post: "/api/v1/auth/pairings" body: "*"};
  }
  rpc InspectPairing(InspectPairingRequest) returns (InspectPairingResponse) {
    option (google.api.http) = {post: "/api/v1/auth/pairings/inspect" body: "*"};
  }
  rpc PollPairing(PollPairingRequest) returns (PollPairingResponse) {
    option (google.api.http) = {post: "/api/v1/auth/pairings/poll" body: "*"};
  }
  rpc CancelPairing(CancelPairingRequest) returns (CancelPairingResponse) {
    option (google.api.http) = {post: "/api/v1/auth/pairings/cancel" body: "*"};
  }
  rpc ClaimPairing(ClaimPairingRequest) returns (ClaimPairingResponse) {
    option (google.api.http) = {post: "/api/v1/auth/pairings/claim" body: "*"};
  }
  rpc RevokeCurrentDevice(RevokeCurrentDeviceRequest) returns (RevokeCurrentDeviceResponse) {
    option (google.api.http) = {post: "/api/v1/auth/devices/current/revoke" body: "*"};
  }
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {
    option (google.api.http) = {get: "/api/v1/auth/devices"};
  }
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {post: "/api/v1/auth/logout" body: "*"};
  }
  rpc CreateChallenge(CreateChallengeRequest) returns (CreateChallengeResponse) {
    option (google.api.http) = {post: "/api/v1/auth/challenges" body: "*"};
  }
  rpc CompleteChallenge(CompleteChallengeRequest) returns (CompleteChallengeResponse) {
    option (google.api.http) = {post: "/api/v1/auth/sessions" body: "*"};
  }
}
message LogoutRequest {}
message LogoutResponse {}
message ListDevicesRequest {}
message RevokeCurrentDeviceRequest {}
message RevokeCurrentDeviceResponse {}
message DeviceGrant {
  string id = 1;
  bytes public_key = 2;
  repeated string scopes = 3;
  int64 expires_at = 4;
  bool revoked = 5;
  string parent_grant_id = 6;
  bool recovery = 7;
}
message ListDevicesResponse { repeated DeviceGrant devices = 1; }
message Pairing {
  string id = 1;
  string device_name = 2;
  bytes public_key = 3;
  bool administrative = 4;
  int64 created_at = 5;
  int64 expires_at = 6;
  string state = 7;
  bytes proposed_root_public_key = 8;
}
message CreatePairingRequest { bytes public_key = 1; string device_name = 2; bool administrative = 3; }
message CreatePairingResponse { Pairing pairing = 1; string code = 2; string poll_token = 3; }
message InspectPairingRequest { string code = 1; }
message InspectPairingResponse { Pairing pairing = 1; }
message PollPairingRequest { string poll_token = 1; }
message PollPairingResponse {
  Pairing pairing = 1;
  string grant_id = 2;
  bytes root_public_key = 3;
  bytes transcript = 4;
  bytes signature = 5;
  bytes parent_transcript = 6;
  bytes parent_signature = 7;
  string parent_grant_id = 8;
  repeated RootHistoryProof root_history = 9;
}
message CancelPairingRequest { string poll_token = 1; }
message CancelPairingResponse {}
message ClaimPairingRequest { string pairing_id = 1; }
message ClaimPairingResponse {}
message ProposePairingRequest { string pairing_id = 1; }
message ProposePairingResponse {}

service SyncService {
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse) {
    option (google.api.http) = {get: "/api/v1/channels/{channel_id}/events/subscribe"};
  }
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option (google.api.http) = {get: "/api/v1/channels/{channel_id}/events"};
  }
}

service AdminService {
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (google.api.http) = {get: "/api/v1/space/members"};
  }
  rpc UpdateMember(UpdateMemberRequest) returns (UpdateMemberResponse) {
    option (google.api.http) = {patch: "/api/v1/space/members/{principal_id}" body: "*"};
  }
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse) {
    option (google.api.http) = {post: "/api/v1/space/invites" body: "*"};
  }
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse) {
    option (google.api.http) = {get: "/api/v1/space/invites"};
  }
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse) {
    option (google.api.http) = {post: "/api/v1/space/invites/{invite_id}/revoke" body: "*"};
  }
  rpc GetSetupStatus(GetSetupStatusRequest) returns (GetSetupStatusResponse) {
    option (google.api.http) = {get: "/api/v1/space/setup"};
  }
  rpc ClaimOwner(ClaimOwnerRequest) returns (ClaimOwnerResponse) {
    option (google.api.http) = {post: "/api/v1/space/setup/claim" body: "*"};
  }
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse) {
    option (google.api.http) = {get: "/api/v1/space/settings"};
  }
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse) {
    option (google.api.http) = {patch: "/api/v1/space/settings" body: "*"};
  }
}
service MembershipService {
  rpc PreviewInvite(PreviewInviteRequest) returns (PreviewInviteResponse) {
    option (google.api.http) = {post: "/api/v1/membership/invites/preview" body: "*"};
  }
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse) {
    option (google.api.http) = {post: "/api/v1/membership/invites/accept" body: "*"};
  }
  rpc GetMembership(GetMembershipRequest) returns (GetMembershipResponse) {
    option (google.api.http) = {get: "/api/v1/membership"};
  }
}
message Member {
  string principal_id = 1;
  string role = 2;
  bool blocked = 3;
  int64 revision = 4;
}
message ListMembersRequest { string after = 1; }
message ListMembersResponse { repeated Member members = 1; string next_cursor = 2; }
message UpdateMemberRequest {
  string principal_id = 1;
  string role = 2;
  bool blocked = 3;
  int64 expected_revision = 4;
}
message UpdateMemberResponse { Member member = 1; }
message Invite {
  string id = 1;
  string role = 2;
  int64 expires_at = 3;
  int32 max_uses = 4;
  int32 uses = 5;
  bool revoked = 6;
}
message CreateInviteRequest { string role = 1; int32 ttl_seconds = 2; int32 max_uses = 3; }
message CreateInviteResponse { Invite invite = 1; string token = 2; }
message ListInvitesRequest { string after = 1; }
message ListInvitesResponse { repeated Invite invites = 1; string next_cursor = 2; }
message RevokeInviteRequest { string invite_id = 1; }
message RevokeInviteResponse {}
message PreviewInviteRequest { string token = 1; }
message PreviewInviteResponse { string role = 1; string server_id = 2; string title = 3; int64 expires_at = 4; }
message AcceptInviteRequest { string token = 1; }
message AcceptInviteResponse { Member member = 1; }
message GetMembershipRequest {}
message GetMembershipResponse { Member member = 1; }
message GetSetupStatusRequest {}
message GetSetupStatusResponse { bool initialized = 1; bool first_login_owner = 2; }
message ClaimOwnerRequest { string setup_code = 1; }
message GetSettingsRequest {}
message ClaimOwnerResponse { SpaceSettings settings = 1; }
message GetSettingsResponse { SpaceSettings settings = 1; }
message UpdateSettingsResponse { SpaceSettings settings = 1; }
message SpaceSettings {
  string title = 1;
  string chat_title = 2;
  bool chat_enabled = 3;
  string registration_policy = 4;
  int64 revision = 5;
}
message UpdateSettingsRequest {
  string title = 1;
  string chat_title = 2;
  bool chat_enabled = 3;
  string registration_policy = 4;
  int64 expected_revision = 5;
}

message SubscribeRequest {
  string channel_id = 1;
  string after = 2;
}
message SubscribeResponse {
  Event event = 1;
  string cursor = 2;
  bool heartbeat = 3;
}

message CreateChallengeRequest {
  // device.register / auth.login / device.revoke.
  string purpose = 1;
  bytes root_public_key = 2;
  bytes device_public_key = 3;
  string grant_id = 4;
  // Только регистрация: root явно разрешает space.manage этому устройству.
  bool administrative = 5;
  // Root явно делегирует восстановление отдельному ключу.
  bool recovery = 6;
  // device.delegate / recovery.device.revoke: действующий recovery grant.
  string recovery_grant_id = 7;
  // Root-подписанное сопряжение с неизменяемым целевым public key.
  string pairing_id = 8;
}
message CreateChallengeResponse {
  string challenge_id = 1;
  // Клиент проверяет поля и восстанавливает байты по фиксированному профилю.
  bytes transcript = 2;
}
message CompleteChallengeRequest {
  string challenge_id = 1;
  bytes signature = 2;
  // Только device.register: вступление атомарно с регистрацией устройства.
  string invitation_token = 3;
}
message CompleteChallengeResponse {
  string grant_id = 1;
  string principal_id = 2;
  string access_token = 3;
  int64 expires_at = 4;
}
message ListEventsRequest {
  string channel_id = 1;
  string after = 2;
}
message ListEventsResponse {
  repeated Event events = 1;
  string next_cursor = 2;
}
message Event {
  string cursor = 1;
  string type = 2;
  Content content = 3;
}

message GetManifestRequest {}
message GetManifestResponse {
  string protocol_version = 1;
  string server_id = 2;
  repeated Channel channels = 3;
  string title = 4;
}
message Channel {
  string id = 1;
  string title = 2;
  repeated View views = 3;
  int32 position = 4;
  bool archived = 5;
  int64 revision = 6;
  ChannelPermissions permissions = 7;
  bool public_preview = 8;
  // Только для авторизованного read; иначе 0.
  int64 latest_message_sequence = 9;
}
// write требует read, read и manage требуют visible.
message ChannelPermissions {
  bool visible = 1;
  bool read = 2;
  bool write = 3;
  bool manage = 4;
}
// Ровно один субъект: role (member/reader) или principal_id.
message ChannelAccessRule {
  string role = 1;
  string principal_id = 2;
  ChannelPermissions permissions = 3;
}
message ListChannelsRequest { bool include_archived = 1; }
message ListChannelsResponse { repeated Channel channels = 1; }
message CreateChannelRequest {
  string channel_id = 1;
  string title = 2;
  string view_type = 3;
  int32 position = 4;
  bool public_preview = 5;
}
message UpdateChannelRequest {
  string channel_id = 1;
  string title = 2;
  int32 position = 3;
  bool archived = 4;
  bool public_preview = 5;
  int64 expected_revision = 6;
}
message CreateChannelResponse { Channel channel = 1; }
message UpdateChannelResponse { Channel channel = 1; }
message GetChannelAccessRequest { string channel_id = 1; }
message UpdateChannelAccessRequest {
  string channel_id = 1;
  int64 expected_revision = 2;
  repeated ChannelAccessRule rules = 3;
}
message GetChannelAccessResponse {
  string channel_id = 1;
  int64 revision = 2;
  repeated ChannelAccessRule rules = 3;
}
message View {
  string id = 1;
  string type = 2;
}
message Content {
  string id = 1;
  string channel_id = 2;
  string text = 3;
  string author_id = 4;
  int64 sequence = 5;
}
message CreateContentRequest {
  string channel_id = 1;
  string text = 2;
  string idempotency_key = 3;
}
message CreateContentResponse { Content content = 1; }
message ListContentRequest {
  string channel_id = 1;
  // Непрозрачный курсор последнего полученного сообщения.
  string after = 2;
}
message ListContentResponse {
  repeated Content contents = 1;
  string next_cursor = 2;
}

message CreateRootRotationRequest {
  string operation_id = 1;
  int64 expected_auth_epoch = 2;
  bytes new_root_public_key = 3;
  bytes new_device_public_key = 4;
  string profile = 5;
}
message CreateRootRotationResponse {
  string challenge_id = 1;
  bytes transcript = 2;
}
message CompleteRootRotationRequest {
  string challenge_id = 1;
  bytes old_signature = 2;
  bytes new_signature = 3;
}
message CompleteRootRotationResponse {
  string principal_id = 1;
  int64 auth_epoch = 2;
  string grant_id = 3;
  bytes transcript = 4;
  bytes old_signature = 5;
  bytes new_signature = 6;
}
message RootHistoryProof { bytes transcript = 1; bytes old_signature = 2; bytes new_signature = 3; }

message UpdateChannelAccessResponse {
  string channel_id = 1;
  int64 revision = 2;
  repeated ChannelAccessRule rules = 3;
}

// Полный авторизованный каталог; его изменения не используют курсор сообщений.
message WatchChannelsRequest { bool include_archived = 1; }
message WatchChannelsResponse {
  repeated Channel channels = 1;
  string space_title = 2;
  string role = 3;
  bool heartbeat = 4;
  string server_id = 5;
}
