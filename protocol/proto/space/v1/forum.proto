syntax = "proto3";
package space.v1;
import "space/v1/space.proto";
option go_package = "github.com/space-protocol-project/space-server/gen/space/v1;spacev1";

// core.forum.v1: отдельные открытые форумные разделы с ACL канала.
service ForumService {
  rpc ReportForumContent(ReportForumContentRequest) returns (ReportForumContentResponse);
  rpc ListForumReports(ListForumReportsRequest) returns (ListForumReportsResponse);
  rpc ResolveForumReport(ResolveForumReportRequest) returns (ResolveForumReportResponse);
  rpc ListForumThreads(ListForumThreadsRequest) returns (ListForumThreadsResponse);
  rpc GetForumThread(GetForumThreadRequest) returns (GetForumThreadResponse);
  rpc CreateForumThread(CreateForumThreadRequest) returns (CreateForumThreadResponse);
  rpc ReplyForumThread(ReplyForumThreadRequest) returns (ReplyForumThreadResponse);
  rpc SetForumThreadPinned(SetForumThreadPinnedRequest) returns (SetForumThreadPinnedResponse);
  rpc MarkForumThreadRead(MarkForumThreadReadRequest) returns (MarkForumThreadReadResponse);
  rpc CloseForumThread(CloseForumThreadRequest) returns (CloseForumThreadResponse);
  rpc ModerateForumThread(ModerateForumThreadRequest) returns (ModerateForumThreadResponse);
  rpc ModerateForumReply(ModerateForumReplyRequest) returns (ModerateForumReplyResponse);
  rpc ListForumModeration(ListForumModerationRequest) returns (ListForumModerationResponse);
}
message ForumThread {
  bool hidden = 18;
  bool pinned = 13;
  bool read_state_supported = 14;
  bool seen = 15;
  int64 read_sequence = 16;
  int64 unread_count = 17;
  repeated Asset attachments = 12;
  string id = 1;
  string channel_id = 2;
  string author_id = 3;
  string author_name = 4;
  string title = 5;
  string text = 6;
  int64 created_at_unix = 7;
  int64 sequence = 8;
  int64 revision = 9;
  bool closed = 10;
  int64 reply_count = 11;
}
message ForumReply {
  bool hidden = 9;
  int64 revision = 10;
  repeated Asset attachments = 8;
  string id = 1;
  string thread_id = 2;
  string author_id = 3;
  string author_name = 4;
  string text = 5;
  int64 created_at_unix = 6;
  int64 sequence = 7;
}
// Курсоры — sequence последней записи; 0 начинает чтение, limit 1..50 (0 = 50).
message ListForumThreadsRequest { string channel_id = 1; int64 after_sequence = 2; int32 limit = 3; bool pinned_first = 4; bool after_pinned = 5; }
message ListForumThreadsResponse { repeated ForumThread threads = 1; int64 next_sequence = 2; bool next_pinned = 3; }
message GetForumThreadRequest { string channel_id = 1; string thread_id = 2; int64 after_sequence = 3; int32 limit = 4; }
message GetForumThreadResponse { ForumThread thread = 1; repeated ForumReply replies = 2; int64 next_sequence = 3; }
// Заголовок 1..320 байт UTF-8, текст до 8192, ключ 1..128; автор берётся из сессии.
// Пустой текст разрешён только с вложением. До пяти файлов; core.forum.attachments.v1.
message CreateForumThreadRequest { string channel_id = 1; string title = 2; string text = 3; string idempotency_key = 4; repeated string attachment_ids = 5; }
message CreateForumThreadResponse { ForumThread thread = 1; }
message ReplyForumThreadRequest { string channel_id = 1; string thread_id = 2; string text = 3; string idempotency_key = 4; repeated string attachment_ids = 5; }
message ReplyForumThreadResponse { ForumReply reply = 1; ForumThread thread = 2; }
// Требует manage и read; право автора само по себе не разрешает закрытие.
message CloseForumThreadRequest { string channel_id = 1; string thread_id = 2; int64 expected_revision = 3; }
message CloseForumThreadResponse { ForumThread thread = 1; }

// core.forum.navigation.v1. Закрепление требует read/manage и scope space.manage.
message SetForumThreadPinnedRequest { string channel_id = 1; string thread_id = 2; bool pinned = 3; int64 expected_revision = 4; }
message SetForumThreadPinnedResponse { ForumThread thread = 1; }
// Курсор чтения относится к principal сессии, монотонный; 0 отмечает первое сообщение.
message MarkForumThreadReadRequest { string channel_id = 1; string thread_id = 2; int64 through_sequence = 3; }
message MarkForumThreadReadResponse { ForumThread thread = 1; }

// core.forum.moderation.v1. Все операции требуют read/manage и scope space.manage.
// Причина 1..1024 байт UTF-8 обязательна; скрытое содержимое не возвращается даже автору.
message ModerateForumThreadRequest { string channel_id = 1; string thread_id = 2; string action = 3; string reason = 4; int64 expected_revision = 5; }
message ModerateForumThreadResponse { ForumThread thread = 1; }
// action темы: reopen, hide, restore. Ответы сохраняют последовательность при скрытии.
message ModerateForumReplyRequest { string channel_id = 1; string thread_id = 2; string reply_id = 3; bool hidden = 4; string reason = 5; int64 expected_revision = 6; }
message ModerateForumReplyResponse { ForumReply reply = 1; ForumThread thread = 2; }
// Журнал виден только модератору. Курсор id последней записи, 0 начинает чтение.
message ListForumModerationRequest { string channel_id = 1; string thread_id = 2; int64 after_id = 3; int32 limit = 4; }
message ForumModerationEvent {
  int64 report_id = 9; int64 id = 1; string thread_id = 2; string reply_id = 3; string action = 4; string reason = 5; string actor_id = 6; int64 revision = 7; int64 created_at_unix = 8; }
message ListForumModerationResponse { repeated ForumModerationEvent events = 1; int64 next_id = 2; }


// core.forum.reports.v1: сведения о заявителе не возвращаются клиентам.
message ForumReport {
  string thread_title = 10;
  int64 id = 1;
  string thread_id = 2;
  string reply_id = 3;
  string reason = 4;
  string decision = 5;
  string decision_reason = 6;
  string moderator_id = 7;
  int64 created_at_unix = 8;
  int64 resolved_at_unix = 9;
}
message ReportForumContentRequest {
  string channel_id = 1;
  string thread_id = 2;
  string reply_id = 3;
  string reason = 4;
}
message ReportForumContentResponse {}
message ListForumReportsRequest {
  string channel_id = 1;
  int64 after_id = 2;
  int32 limit = 3;
  bool resolved = 4;
}
message ListForumReportsResponse {
  repeated ForumReport reports = 1;
  int64 next_id = 2;
}
message ResolveForumReportRequest {
  string channel_id = 1;
  int64 report_id = 2;
  string decision = 3; // dismiss или hide.
  string reason = 4;
  int64 expected_revision = 5; // Ревизия темы или ответа для hide.
}
message ResolveForumReportResponse { ForumReport report = 1; }
