syntax = "proto3";
package space.v1;
option go_package = "github.com/space-protocol-project/space-server/gen/space/v1;spacev1";

// Эксперимент P1. Отдельная регистрация, без публичной capability v1.
service ExtensionP1Service {
  rpc QueryExtension(QueryExtensionRequest) returns (QueryExtensionResponse);
  rpc ExecuteExtensionCommand(ExecuteExtensionCommandRequest) returns (ExecuteExtensionCommandResponse);
  rpc ReconcileExtensionCommand(ReconcileExtensionCommandRequest) returns (ReconcileExtensionCommandResponse);
  rpc GetExtensionMutationContext(GetExtensionMutationContextRequest) returns (GetExtensionMutationContextResponse);
}

// Доверенный контекст получают до первой отправки и сохраняют вместе с командой.
message GetExtensionMutationContextRequest {
  string instance_id = 1;
}
message GetExtensionMutationContextResponse {
  // 32 строчных шестнадцатеричных символа; меняется при restore, но не restart.
  string history_id = 1;
}

message QueryExtensionRequest {
  string instance_id = 1;
  string query = 2;
  bytes payload_json = 3; // UTF-8 JSON, не больше 16 КиБ; context задаёт только ядро.
}
message QueryExtensionResponse {
  bytes document_json = 1;
  string ui_api = 2;
}

enum ExtensionCommandEffect {
  EXTENSION_COMMAND_EFFECT_UNSPECIFIED = 0;
  EXTENSION_COMMAND_EFFECT_NONE = 1;
  EXTENSION_COMMAND_EFFECT_MUTATION = 2;
}
message ExecuteExtensionCommandRequest {
  string instance_id = 1;
  string command = 2;
  bytes payload_json = 3;
  // Должен совпадать с доверенным описанием команды. Клиент не выдаёт полномочия.
  ExtensionCommandEffect effect = 4;
  string idempotency_key = 5;
  uint64 expected_state_revision = 6;
  // Обязателен для исполнения MUTATION. При повторе менять запрещено.
  // Для сверки старой квитанции сохраняется исходное значение, включая пустое v1/v2.
  string history_id = 7;
}
message ExecuteExtensionCommandResponse {
  bytes document_json = 1;
  ExtensionCommandEffect effect = 2;
  uint64 state_revision = 3;
  bool replayed = 4;
}

// Проверяет точный исходный запрос, не исполняя команду и не вызывая WASM.
message ReconcileExtensionCommandRequest {
  ExecuteExtensionCommandRequest command = 1;
}
enum ExtensionCommandOutcome {
  EXTENSION_COMMAND_OUTCOME_UNSPECIFIED = 0;
  // Квитанция отсутствует; это НЕ доказательство отсутствия эффекта.
  EXTENSION_COMMAND_OUTCOME_UNKNOWN = 1;
  EXTENSION_COMMAND_OUTCOME_CONFIRMED = 2;
}
message ReconcileExtensionCommandResponse {
  ExtensionCommandOutcome outcome = 1;
  // Только для CONFIRMED; выдача требует текущих прав исполнения команды.
  ExecuteExtensionCommandResponse receipt = 2;
  // P1 пока возвращает false/0: гарантированное окно до первой отправки ещё не реализовано.
  // UNKNOWN никогда не разрешает повторную отправку сам по себе.
  bool retry_window_known = 3;
  uint64 retry_window_remaining_ms = 4;
}

// Недоверенное предложение WASM, не SQL и не разрешение записи.
// Приёмка требует новой проверки сессии/ACL внутри транзакции записи.
message ExtensionMutationPlan {
  uint64 expected_state_revision = 1;
  repeated ExtensionMutationOperation operations = 2;
  repeated ExtensionMutationEvent events = 3;
}
message ExtensionMutationOperation {
  string key = 1;
  oneof change {
    bytes put_json = 2;
    bool delete = 3; // Только true; отсутствие change запрещено.
  }
}
message ExtensionMutationEvent {
  string type = 1;
  bytes payload_json = 2;
}
