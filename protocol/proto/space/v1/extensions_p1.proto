syntax = "proto3";
package space.v1;
option go_package = "github.com/space-protocol-project/space-server/gen/space/v1;spacev1";

// Эксперимент P1. Отдельная регистрация, без публичной capability v1.
service ExtensionP1Service {
  rpc ListExtensionContributions(ListExtensionContributionsRequest) returns (ListExtensionContributionsResponse);
  rpc QueryExtension(QueryExtensionRequest) returns (QueryExtensionResponse);
  rpc ExecuteExtensionCommand(ExecuteExtensionCommandRequest) returns (ExecuteExtensionCommandResponse);
  rpc ReconcileExtensionCommand(ReconcileExtensionCommandRequest) returns (ReconcileExtensionCommandResponse);
  rpc GetExtensionMutationContext(GetExtensionMutationContextRequest) returns (GetExtensionMutationContextResponse);
  rpc ListExtensionInstallations(ListExtensionInstallationsRequest) returns (ListExtensionInstallationsResponse);
  rpc GetExtensionInstallation(GetExtensionInstallationRequest) returns (GetExtensionInstallationResponse);
  rpc ChangeExtensionInstallation(ChangeExtensionInstallationRequest) returns (ChangeExtensionInstallationResponse);
  rpc ListExtensionInstallationAudit(ListExtensionInstallationAuditRequest) returns (ListExtensionInstallationAuditResponse);
}

// Тип элемента, а не разрешение на доступ к данным или нативному UI.
enum ExtensionContributionKind {
  EXTENSION_CONTRIBUTION_KIND_UNSPECIFIED = 0;
  EXTENSION_CONTRIBUTION_KIND_OVERVIEW = 1;
  EXTENSION_CONTRIBUTION_KIND_SECTION = 2;
}

message ExtensionContribution {
  string id = 1;
  ExtensionContributionKind kind = 2;
  map<string, string> title = 3; // До 8 языков, en обязателен, до 120 символов.
  string query = 4; // Объявленный запрос для QueryExtension с тем же instance_id.
}

// Чтение конкретного экземпляра: сессия, read ACL и enabled lifecycle.
// Пустой instance_id не означает перечисление всего пространства.
message ListExtensionContributionsRequest {
  string instance_id = 1;
  ExtensionContributionKind kind = 2; // UNSPECIFIED возвращает оба вида.
}
message ListExtensionContributionsResponse {
  repeated ExtensionContribution contributions = 1; // До 32, порядок по id.
  bytes registry_sha256 = 2; // Идентичность регистрации, не допуск и не квитанция.
}

// Административный API P1: текущая сессия с space.manage, владелец и manage ACL
// всех каналов установки. Не устанавливает пакеты и не принимает роль system.
message ExtensionInstallation {
  string installation_id = 1;
  string state = 2;
  int64 revision = 3;
  string generation = 4;
  bytes binding_sha256 = 5;
}
message ListExtensionInstallationsRequest {
  string after_installation_id = 1;
  int32 page_size = 2; // 0 означает 50; допустимо 1..100.
  string generation = 3; // Обязательно при продолжении; смена требует нового чтения.
}
message ListExtensionInstallationsResponse {
  repeated ExtensionInstallation installations = 1;
  string next_after_installation_id = 2;
  string generation = 3;
}
message GetExtensionInstallationRequest {
  string installation_id = 1;
}
message GetExtensionInstallationResponse {
  ExtensionInstallation installation = 1;
}
message ChangeExtensionInstallationRequest {
  string installation_id = 1;
  string generation = 2;
  int64 expected_revision = 3;
  string action = 4; // Только enable, disable, remove.
}
message ChangeExtensionInstallationResponse {
  string state = 1;
  int64 revision = 2;
  string generation = 3;
}
message ExtensionInstallationAuditEntry {
  int64 revision = 1;
  string generation = 2;
  string action = 3;
  string actor = 4; // checkpoint, owner, system; назначает только ядро.
  string principal_id = 5;
  string previous_state = 6;
  string state = 7;
  string created_at = 8; // RFC3339Nano, UTC.
}
message ListExtensionInstallationAuditRequest {
  string installation_id = 1;
  string generation = 2; // Текущее поколение из GetExtensionInstallation.
  int64 after_revision = 3;
  int64 through_revision = 4; // 0 на первой странице; далее возвращённая верхняя граница.
  int32 page_size = 5; // 0 означает 50; допустимо 1..100.
}
message ListExtensionInstallationAuditResponse {
  repeated ExtensionInstallationAuditEntry entries = 1;
  int64 next_after_revision = 2; // 0 означает конец выбранного диапазона.
  int64 through_revision = 3;
  string generation = 4;
}

// Доверенный контекст получают до первой отправки и сохраняют вместе с командой.
message GetExtensionMutationContextRequest {
  string instance_id = 1;
  // Только перед новой командой; повтор не запрашивает новое разрешение.
  bool request_retry_window = 2;
}
message GetExtensionMutationContextResponse {
  // 32 строчных шестнадцатеричных символа; меняется при restore, но не restart.
  string history_id = 1;
  // Короткое разрешение, привязанное к principal, экземпляру и истории.
  // Недействительно после перезапуска исполнителя. Не сохранять как новое окно при resume.
  string retry_lease_id = 2;
  // 30000 мс от выдачи; клиент отсчитывает от начала RPC монотонными часами.
  uint64 retry_window_remaining_ms = 3;
}

message QueryExtensionRequest {
  string instance_id = 1;
  string query = 2;
  bytes payload_json = 3; // UTF-8 JSON, не больше 16 КиБ; context задаёт только ядро.
}
message QueryExtensionResponse {
  bytes document_json = 1;
  string ui_api = 2;
}

enum ExtensionCommandEffect {
  EXTENSION_COMMAND_EFFECT_UNSPECIFIED = 0;
  EXTENSION_COMMAND_EFFECT_NONE = 1;
  EXTENSION_COMMAND_EFFECT_MUTATION = 2;
}
message ExecuteExtensionCommandRequest {
  string instance_id = 1;
  string command = 2;
  bytes payload_json = 3;
  // Должен совпадать с доверенным описанием команды. Клиент не выдаёт полномочия.
  ExtensionCommandEffect effect = 4;
  string idempotency_key = 5;
  uint64 expected_state_revision = 6;
  // Обязателен для исполнения MUTATION. При повторе менять запрещено.
  // Для сверки старой квитанции сохраняется исходное значение, включая пустое v1/v2.
  string history_id = 7;
  // Неизменная часть команды/digest. Пустое значение не разрешает автоматический повтор.
  string retry_lease_id = 8;
}
message ExecuteExtensionCommandResponse {
  bytes document_json = 1;
  ExtensionCommandEffect effect = 2;
  uint64 state_revision = 3;
  bool replayed = 4;
}

// Проверяет точный исходный запрос, не исполняя команду и не вызывая WASM.
message ReconcileExtensionCommandRequest {
  ExecuteExtensionCommandRequest command = 1;
}
enum ExtensionCommandOutcome {
  EXTENSION_COMMAND_OUTCOME_UNSPECIFIED = 0;
  // Квитанция отсутствует; это НЕ доказательство отсутствия эффекта.
  EXTENSION_COMMAND_OUTCOME_UNKNOWN = 1;
  EXTENSION_COMMAND_OUTCOME_CONFIRMED = 2;
}
message ReconcileExtensionCommandResponse {
  ExtensionCommandOutcome outcome = 1;
  // Только для CONFIRMED; выдача требует текущих прав исполнения команды.
  ExecuteExtensionCommandResponse receipt = 2;
  // Сверка возвращает false/0 и не открывает окно заново. Короткое окно выдаёт контекст новой команды.
  // UNKNOWN никогда не разрешает повторную отправку сам по себе.
  bool retry_window_known = 3;
  uint64 retry_window_remaining_ms = 4;
}

// Недоверенное предложение WASM, не SQL и не разрешение записи.
// Приёмка требует новой проверки сессии/ACL внутри транзакции записи.
message ExtensionMutationPlan {
  uint64 expected_state_revision = 1;
  repeated ExtensionMutationOperation operations = 2;
  repeated ExtensionMutationEvent events = 3;
}
message ExtensionMutationOperation {
  string key = 1;
  oneof change {
    bytes put_json = 2;
    bool delete = 3; // Только true; отсутствие change запрещено.
  }
}
message ExtensionMutationEvent {
  string type = 1;
  bytes payload_json = 2;
}
