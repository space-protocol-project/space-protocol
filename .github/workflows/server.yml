name: Проверка сервера
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: space_test
          POSTGRES_USER: space
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U space -d space_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      SPACE_TEST_DATABASE_URL: postgres://space:ci-only-password@127.0.0.1:5432/space_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Проверка конфигурации локальной базы
        env:
          SPACE_POSTGRES_PASSWORD: ci-only-password
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Проверки UI-прототипа и согласия на оформление
        run: |
          npm ci --prefix server/tools
          node server/tools/qr.test.mjs
          node --check client/design/prototype/app.js
          node --check client/design/prototype/theme.js
          node client/design/prototype/theme.test.mjs
          node --check server/internal/spaceweb/assets/app.mjs
          node --check server/internal/spaceweb/assets/identity.mjs
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Тесты с проверкой гонок
        working-directory: server
        run: go test -race ./...
      - name: Статический анализ
        working-directory: server
        run: go vet ./...
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Анализ и тесты Flutter-клиента
        working-directory: client
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Сквозная проверка входа, событий и отзыва
        working-directory: server
        env:
          SPACE_DATABASE_URL: postgres://space:ci-only-password@127.0.0.1:5432/space_test?sslmode=disable
        run: |
          go build -o "$RUNNER_TEMP/space-server" ./cmd/space-server
          SPACE_SETUP_CODE=$("$RUNNER_TEMP/space-server" -setup-code)
          echo "::add-mask::$SPACE_SETUP_CODE"
          export SPACE_SETUP_CODE
          "$RUNNER_TEMP/space-server" -http 127.0.0.1:18080 &
          server_pid=$!
          trap 'kill "$server_pid"; wait "$server_pid" || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          go run ./cmd/space-demo -origin http://127.0.0.1:18080
          node tools/admin-interop.mjs
          npx --prefix tools playwright install --with-deps chromium
          node tools/browser-restart.mjs
          node tools/camera-interop.mjs
          node tools/root-rotation-interop.mjs
          node tools/browser-rotation-interop.mjs
          cd ../client
          dart run tool/interoperability.dart http://127.0.0.1:18080
  native-vault:
    name: Нативное хранилище Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Сборка отдельного проверочного приложения
        env:
          SPACE_VAULT_CRASH_BUILD: '1'
        working-directory: client
        run: |
          flutter pub get
          flutter build windows --release --target tool/native_vault_drill.dart
      - name: Перезапуск с настоящим системным vault
        working-directory: client
        run: ./tool/native_vault_drill.ps1
