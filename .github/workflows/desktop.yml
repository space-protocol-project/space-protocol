name: Установщики приложения
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['client/**', 'packages/**', 'packaging/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['client/**', 'packages/**', 'packaging/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows
          - os: macos-14
            target: macos
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Зависимости Linux (только CI)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - name: Зависимости приложения
        working-directory: client
        run: flutter pub get
      - name: Сборка
        working-directory: client
        run: flutter build ${{ matrix.target }} --release
      - name: Windows Setup
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist/Space-Setup-windows-x64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Space-Setup-windows-x64.exe" } | Set-Content dist/SHA256SUMS.txt
      - name: macOS DMG
        if: matrix.target == 'macos'
        run: bash packaging/build-macos.sh
      - name: Linux RUN
        if: matrix.target == 'linux'
        run: |
          bash packaging/build-linux.sh
          sha256sum dist/*.run > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Space-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
