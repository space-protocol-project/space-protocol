name: space_admin
description: "Отдельная панель управления сервером Space."
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  space_admin_ui:
    path: ../../packages/space_admin_ui
  space_api:
    path: ../../packages/space_api
  space_identity:
    path: ../../packages/space_identity
  space_ui:
    path: ../../packages/space_ui
dev_dependencies:
  http: ^1.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
  assets:
    - assets/fonts/OFL.txt
